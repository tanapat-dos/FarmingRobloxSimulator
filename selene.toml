# Selene lint config — https://kampfkarren.github.io/selene/
# `roblox` std is auto-generated by selene on first run.
std = "roblox"

[lints]
# The codebase predates the linter; keep the noisiest style lints as warnings
# (selene only hard-fails on error-severity diagnostics and parse errors).
unused_variable = "warn"
shadowing = "warn"
